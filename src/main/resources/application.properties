spring.application.name=career-demo
server.port=8080

# ?????????????????? debug?????? info
logging.level.root=info
logging.level.com.wzu.demo=debug

# ????????? traceId??????/???????
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{20} - %msg%n

# ????????+????????????
logging.file.name=logs/career-demo.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

spring.datasource.url=jdbc:mysql://localhost:3306/career_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.profiles.active=local

# ===== JWT?????????=====
jwt.secret=${JWT_SECRET:wzu-career-demo-secret-key-2026-please-change}
jwt.expire-hours=2